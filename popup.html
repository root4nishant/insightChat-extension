<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp AI Analyzer</title>
    <script src="popup.js" defer></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f4f5f7;
        color: #1f2937;
        margin: 0;
        padding: 1rem;
        width: 300px;
      }

      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #4f46e5;
        text-align: center;
      }

      #analyze {
        background-color: #4f46e5;
        color: white;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        display: block;
        margin: 0 auto 1rem auto;
        transition: background-color 0.3s;
      }

      #analyze:hover {
        background-color: #4338ca;
      }

      #result {
        background-color: white;
        border-radius: 8px;
        padding: 1rem;
        font-size: 0.875rem;
        color: #374151;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        max-height: 300px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h2>WhatsApp AI Insights</h2>
    <button id="analyze">Analyze Chat</button>
    <div id="result">No results yet.</div>
  </body>
</html>
